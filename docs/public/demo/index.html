<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papyrus Core — Engine & Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #f3f4f6;
    }

    #root {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }

    /* PDF.js Text Layer Styles */
    .textLayer {
      position: absolute;
      text-align: initial;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.2;
      line-height: 1;
      text-rendering: optimizeLegibility;
    }

    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .textLayer ::selection {
      background: rgba(0, 0, 255, 0.2);
    }

    /* Prevenir selecao de UI quando desenhando */
    .no-select {
      user-select: none;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Ci1MTu4i.js"></script>
</head>

<body>
  <div id="root"></div>
</body>

</html>
