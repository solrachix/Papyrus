name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Review this pull request as a senior engineer.

            First understand the context:
            - Read the PR title and description.
            - Read linked issues/tasks when available.
            - Read relevant PR comments and review comments.
            - Treat resolved conversations as historical context only.
            - Do not repeat resolved findings unless they are still valid in the current diff.

            Review goals:
            - Verify whether the PR solves the intended issue/task.
            - Focus on correctness, regressions, security, performance, data loss, deployment/runtime risks, missing tests, and architecture mismatches.
            - Avoid style, naming, formatting, or personal preference comments unless they create a real bug or maintainability risk.

            Output format:
            - Start with a short "Review summary".
            - Then list findings grouped by severity:
              - Blocking
              - Non-blocking
              - Observations
            - For each finding include:
              - File path
              - Problem
              - Why it matters
              - Suggested fix
              - Confidence: High / Medium / Low
            - Do not say "good to merge" if there are unresolved Blocking findings.
            - If there are no Blocking findings, say: "No blocking issues found."
            - Keep the review concise. Maximum 5 findings.
